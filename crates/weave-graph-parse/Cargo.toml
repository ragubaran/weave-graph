[package]
name = "weave-graph-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tree-sitter AST extraction, wiring-card generation, and language adapters for weave-graph."

[dependencies]
tree-sitter = "0.27.0"
# Core set (impl.md M1.2's original three + M1.2b's four required
# languages): always compiled in, never gated — every other grammar below
# is "extended" and behind `lang-extended` (impl.md M3.8's binary-size
# fix). Real measured contribution to the linked binary: core grammars
# total ~11MB of rlib weight; the 21 extended ones total ~40MB.
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
# Extended set (impl.md M1.2b's widened ten + M1.2c's graduated six +
# config-format four): optional, behind `lang-extended`.
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-css = { version = "0.23.2", optional = true }
tree-sitter-dart = { version = "0.2.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-powershell = { version = "0.26.4", optional = true }
tree-sitter-properties = { version = "0.3.0", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-scala = { version = "0.26.2", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-swift = { version = "0.7.3", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
sha2 = "0.10.9"
thiserror = "2.0.20"
weave-graph-core = { path = "../weave-graph-core" }
pulldown-cmark = { version = "0.13", optional = true }

[features]
default = ["lang-extended"]
docs = ["dep:pulldown-cmark"]
lang-extended = [
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-html",
    "dep:tree-sitter-json",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-php",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-properties",
    "dep:tree-sitter-r",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-zig",
]
# P10.8: typed `route -> handler` edges, pilot scoped to Flask-style
# `@app.route()`/`@app.get()`/etc. decorators over the existing Python
# extractor. No new dependency (reuses tree-sitter-python, already a
# core-tier grammar) and no default-build cost — off unless requested.
framework-routes = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parser_throughput"
harness = false

# `tests/fixture_extraction.rs` mixes core + extended fixtures (gated
# per-function inside the file instead) — these five files are entirely
# about `lang-extended` languages, so the whole target is gated here
# instead: Cargo skips building/running them at all when the feature is
# off, rather than every test inside needing its own `#[cfg]`.
[[test]]
name = "config_extraction"
required-features = ["lang-extended"]

[[test]]
name = "cross_config_linking"
required-features = ["lang-extended"]

[[test]]
name = "r_extraction"
required-features = ["lang-extended"]

[[test]]
name = "sql_extraction"
required-features = ["lang-extended"]

[[test]]
name = "web_extraction"
required-features = ["lang-extended"]
