[package]
name = "weave-graph-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional delta ingestion/publish service for weave-graph. Never linked into the default binary. Stubbed until the `hub` feature is scheduled."

[dependencies]
thiserror = "2.0.20"
toml = "1.1.5"
weave-graph-core = { path = "../weave-graph-core" }
weave-graph-store-sqlite = { path = "../weave-graph-store-sqlite", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
flate2 = { version = "1.1", optional = true }
sha2 = { version = "0.10", optional = true }
serde_yaml = { version = "0.9.34", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Independently compilable per-capability features — a
# deployment that only wants Merkle-signed snapshots shouldn't pull in
# the canvas generator or webhook dispatcher, or vice versa.
hub-provenance = ["dep:sha2"]
# Registry-side canvas aggregation: opens the latest committed snapshot as
# a real SQLite graph (hence the one new required dependency, scoped to
# this feature alone) and renders the same Louvain module clustering
# `weave report`'s LOD 1 uses (`weave-graph-core::modules`, the one shared
# implementation both crates call — never forked).
hub-canvas = ["dep:weave-graph-store-sqlite", "dep:serde", "dep:serde_json"]
# Asynchronous webhook dispatch on successful push — no new dependency;
# reuses the same hand-rolled `std::net::TcpStream` HTTP style already in
# `client.rs`/`server.rs`, just POSTing to an operator-registered URL
# instead of the registry's own.
hub-webhooks = []
hub-compression = ["dep:flate2"]
# HUB-03: mesh-wide `/mesh/policy-lint` endpoint. Depends on `hub-canvas`
# deliberately, not just for its SQLite-snapshot-read dependency: it
# reuses `CanvasAuthorizer` as its own repo-view gate (`docs/proposal-skylos.md`
# §6.6's explicit instruction — the same authorization *type*, not a second
# `PolicyLintAuthorizer` invented to parallel it), plus `weave-graph-core`'s
# own `policy-lint` feature for the `Boundary`/`lint` types and evaluation.
# Sequenced strictly after FED-01.
hub-policy-lint = ["hub-canvas", "dep:serde_yaml", "weave-graph-core/policy-lint"]
