[package]
name = "weave-graph-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Graph model, CSR adjacency, traversal algorithms, and storage trait definitions for weave-graph. No I/O backend, no network."

[dependencies]
blake3 = { version = "1", optional = true }
petgraph = { version = "0.8.3", default-features = false }
roaring = "0.11.5"
thiserror = "2.0.20"

[features]
notes = ["dep:blake3"]
federation = []
provenance = []
rbac = []
policy-lint = []
fts = []
vector = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "csr_memory"
harness = false
