[package]
name = "weave-graph-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP transport adapter and tool surface for weave-graph (weave_repo_map, weave_file_api, weave_trace_calls, weave_impact_radius)."

[dependencies]
weave-graph-core = { path = "../weave-graph-core" }
weave-graph-store-sqlite = { path = "../weave-graph-store-sqlite" }
weave-graph-parse = { path = "../weave-graph-parse", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9.34", optional = true }
thiserror = "2.0.20"

[features]
# M2.10's MCP pair (weave_pin_note / weave_recall_notes). blake3 enters
# only through core's `notes` feature — never the default build.
notes = ["weave-graph-core/notes", "dep:weave-graph-parse"]
# M3.0: masks trace_calls/impact_radius through the same RbacGuard the CLI
# uses (weave-graph-cli builds it; this crate only receives the guard).
rbac = ["weave-graph-core/rbac"]
# CORE-03/SEC-04: weave_search_semantic, landed after SEC-01's pre-truncation
# masking fix so this tool never ships the Top-K starvation bug on day one.
vector = ["weave-graph-core/vector", "weave-graph-store-sqlite/vector"]
# CORE-03: weave_policy_lint. YAML parsing is duplicated from
# `weave-graph-cli::policy` (dependency direction is CLI -> MCP, never the
# reverse), not shared.
policy-lint = ["dep:serde_yaml", "weave-graph-core/policy-lint"]

[dev-dependencies]
tempfile = "3.27.0"
weave-graph-store-sqlite = { path = "../weave-graph-store-sqlite" }

