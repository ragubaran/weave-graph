[package]
name = "weave-graph-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP transport adapter and tool surface for weave-graph (weave_repo_map, weave_file_api, weave_trace_calls, weave_impact_radius)."

[dependencies]
weave-graph-core = { path = "../weave-graph-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"

[dev-dependencies]
weave-graph-store-sqlite = { path = "../weave-graph-store-sqlite" }

