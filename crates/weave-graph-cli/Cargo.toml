[package]
name = "weave-graph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `weave` binary; wires the other weave-graph crates together per enabled features."

[[bin]]
name = "weave"
path = "src/main.rs"
bench = false

[[bench]]
name = "slm_routing"
harness = false
required-features = ["slm"]

[[bench]]
name = "slm_accuracy"
harness = false
required-features = ["slm"]

[[bench]]
name = "indexing_throughput"
harness = false

[dependencies]
weave-graph-core = { path = "../weave-graph-core" }
weave-graph-parse = { path = "../weave-graph-parse", default-features = false }
weave-graph-store-sqlite = { path = "../weave-graph-store-sqlite" }
weave-graph-mcp = { path = "../weave-graph-mcp" }
weave-graph-hub = { path = "../weave-graph-hub", optional = true }
clap = { version = "=4.5.55", features = ["derive"] }
walkdir = "2.5"
fslock = "0.2.1"
toml = "1.1.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.1.2", default-features = false, features = ["rustls", "json"], optional = true }
serde_yaml = { version = "0.9.34", optional = true }
sha2 = { version = "0.10", optional = true }
notify = { version = "8.2.0", optional = true }
# Not feature-gated: `weave-graph-core` already links `roaring`
# unconditionally (CSR reachability), so naming it directly here for
# `blast.rs`'s own bitmap union adds zero new dependency to any build.
roaring = "0.11.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.27.0"
criterion = "0.8.2"

[features]
notes = ["weave-graph-core/notes", "weave-graph-mcp/notes"]
# `lang-extended` on by default preserves today's full-language behavior
# byte-for-byte; `--no-default-features` now also opts into the smaller,
# 8-core-language binary (impl.md M3.8's binary-size fix) as a side effect
# of there being something in `default` to opt out of for the first time.
default = ["lang-extended"]
lang-extended = ["weave-graph-parse/lang-extended"]
hub = ["dep:weave-graph-hub"]
hub-provenance = ["hub", "weave-graph-hub/hub-provenance"]
docs = ["weave-graph-parse/docs"]
federation = ["weave-graph-core/federation"]
provenance = ["weave-graph-core/provenance", "weave-graph-store-sqlite/provenance"]
slm = ["dep:sha2"]
rbac = ["weave-graph-core/rbac", "weave-graph-mcp/rbac"]
github-auth = ["rbac", "dep:ureq"]
http-compression = ["weave-graph-mcp/http-compression"]
otel = []
policy-lint = ["dep:serde_yaml", "weave-graph-core/policy-lint", "weave-graph-mcp/policy-lint"]
fts = ["weave-graph-core/fts", "weave-graph-store-sqlite/fts"]
vector = ["fts", "weave-graph-core/vector", "weave-graph-store-sqlite/vector", "weave-graph-mcp/vector"]
# Convenience bundles (plan.md §0.2), matching the two distributed release
# variants (docs/deploy.md §1): no new code, just a named shorthand for the
# feature list a `weave`/`weave-custom` build actually needs.
viz = []
team = ["docs", "federation"]
custom = ["team", "hub", "hub-provenance", "provenance", "rbac", "otel", "policy-lint", "fts", "vector"]
watch = ["dep:notify"]
