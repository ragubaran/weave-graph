[package]
name = "weave-graph-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-browser WebAssembly query engine for Weave Graph (feature: wasm, plan.md §1.1)."

[lib]
name = "weave_graph_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
weave-graph-core = { path = "../weave-graph-core" }
