# TLS termination for the plaintext `weave-registry` behind this proxy —
# the registry itself never speaks TLS; this one-hop reverse proxy does.
server {
    listen 443 ssl;
    http2 on;
    server_name registry.example.internal;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.3;

    # Pushes are bounded (snapshot blobs); keep bodies under a sane cap.
    client_max_body_size 512m;

    location / {
        proxy_pass http://weave-registry:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Request headers (base-sha, retention, signature) pass through
        # automatically; these three are the registry's own custom
        # *response* headers (pull signature, chunk-resume offset, backoff
        # hint) — explicit so a future nginx default never silently drops one.
        proxy_pass_header X-Weave-Signature;
        proxy_pass_header Upload-Offset;
        proxy_pass_header Retry-After;
    }
}
