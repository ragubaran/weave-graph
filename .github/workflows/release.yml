name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.1)'
        required: true
        type: string
      create_tag:
        description: 'Create Git tag and release branch automatically'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tag & Branch Initialization (If triggered manually)
  # ---------------------------------------------------------------------------
  prepare-tag:
    name: Prepare Git Tag & Branch
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Create Tag/Branch
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            if [ "${{ inputs.create_tag }}" = "true" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git branch "release/$TAG" "$TAG" || true
              git push origin "$TAG"
              git push origin "release/$TAG" || true
            elif ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              # create_tag=false with a tag that doesn't exist would publish a
              # GitHub Release with no matching git ref to check out.
              echo "::error::Tag '$TAG' not found. Push it first, or re-run with create_tag=true."
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Pre-Release Quality Gate (AGENTS.md §7.1) — a tag push skips ci.yml
  # entirely (it only triggers on branches), so this is the only check a
  # release build gets. Mirrors ci.yml's lint+coverage jobs.
  # ---------------------------------------------------------------------------
  pre-release-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features --exclude weave-graph-python -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --all-features --exclude weave-graph-python
      
      # Run Python bindings tests separately for better coverage tracking
      - name: Run Python Bindings Tests
        run: |
          cd crates/weave-graph-python
          cargo test --features python --lib
          python3 -c "import sys; print('Python version:', sys.version)"

      - name: Verify Coverage (>= 90%)
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 90

  # ---------------------------------------------------------------------------
  # 3. Cross-Platform Binary Build Matrix
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.variant }}, ${{ matrix.target }})
    needs: [prepare-tag, pre-release-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two release variants (docs/deploy.md §1) built across every
        # platform target: `weave` (team = docs+federation+fts+vector;
        # single and multiple mode) and `weave-custom` (custom =
        # team+hub+rbac+otel+policy-lint+fts+vector; adds custom mode).
        include:
          # Linux x86_64 (GLIBC)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: weave
            archive_ext: tar.gz
            variant: weave
            features: team
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: weave
            archive_ext: tar.gz
            variant: weave-custom
            features: custom
          # Linux x86_64 (MUSL Static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: weave
            archive_ext: tar.gz
            variant: weave
            features: team
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: weave
            archive_ext: tar.gz
            variant: weave-custom
            features: custom
          # Linux ARM64 (MUSL Static) — docs/release.md §2.1 lists this as a
          # supported Homebrew/tap target; no native apt cross-gcc for musl
          # aarch64 exists, so this one builds via `cross` (Docker), not `cargo`.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: weave
            archive_ext: tar.gz
            variant: weave
            features: team
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: weave
            archive_ext: tar.gz
            variant: weave-custom
            features: custom
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: weave
            archive_ext: tar.gz
            variant: weave
            features: team
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: weave
            archive_ext: tar.gz
            variant: weave-custom
            features: custom
          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: weave
            archive_ext: tar.gz
            variant: weave
            features: team
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: weave
            archive_ext: tar.gz
            variant: weave-custom
            features: custom
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: weave.exe
            archive_ext: zip
            variant: weave
            features: team
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: weave.exe
            archive_ext: zip
            variant: weave-custom
            features: custom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Musl Dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}-${{ matrix.target }}

      - name: Install cross (aarch64 musl cross-compiler)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@cross

      - name: Build Optimized Production Binary (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --bin weave --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Build Optimized Production Binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --bin weave --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Package Binary & Checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          TAG="${{ needs.prepare-tag.outputs.release_tag }}"
          ARCHIVE="${{ matrix.variant }}-${TAG}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} .
          tar -czvf "$ARCHIVE" ${{ matrix.binary_name }} README.md AGENTS.md
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Package Binary & Checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Tag = "${{ needs.prepare-tag.outputs.release_tag }}"
          $Archive = "${{ matrix.variant }}-${Tag}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" .
          Compress-Archive -Path "${{ matrix.binary_name }}", "README.md", "AGENTS.md" -DestinationPath "$Archive"
          $Hash = (Get-FileHash -Algorithm SHA256 "$Archive").Hash.ToLower()
          "$Hash  $Archive" | Out-File -Encoding ascii "${Archive}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.variant }}-${{ matrix.target }}
          path: |
            weave-*.*
            *.sha256

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [prepare-tag, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Generate Consolidated SHA256 Checksum Manifest
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.release_tag }}
          name: Release ${{ needs.prepare-tag.outputs.release_tag }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
